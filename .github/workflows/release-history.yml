name: release-history

on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: write

jobs:
  backfill:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Backfill formal release tags and GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          create_release() {
            local version="$1"
            local sha="$2"
            local notes="$3"
            local tag="v${version}"

            git cat-file -e "${sha}^{commit}"

            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git tag -a "${tag}" "${sha}" -m "ShowMeWhy ${version}"
              git push origin "refs/tags/${tag}"
            fi

            if ! gh release view "${tag}" >/dev/null 2>&1; then
              gh release create "${tag}" \
                --verify-tag \
                --title "ShowMeWhy ${version}" \
                --notes "${notes}"
            fi
          }

          create_release \
            "1.0.0" \
            "d65ae9d9d0960e182a7d5326118f0dc4906a578e" \
            "Formalises the ShowMeWhy Receipt, machine-readable schema, representation grammar, behavioural benchmark and cross-agent platform guidance."

          create_release \
            "1.0.1" \
            "ebf6c82aa4ad9fa12ea9457b0ebf25bdac68049b" \
            "Adds Claude Code plugin and marketplace packaging together with deterministic installation validation."

          create_release \
            "2.0.0" \
            "0563e5429d7cfc64950354550cde50cb0b768f3f" \
            "Adds local Bash PostToolUse context compression, raw-evidence retention, deterministic execution digests, shadow mode and real context-token accounting."

          create_release \
            "3.0.0" \
            "0fab0d1289273d8a8ae9dfd54af6ca296880780d" \
            "Adds typed provenance grounded in retained execution evidence, stable evidence/run addresses, causal-edge validation, run comparison and local inspection."

          create_release \
            "4.0.0" \
            "cbb95333298ec12f4b03ba5ebfe4e2732f9123a7" \
            "Adds adaptive context policy driven by operational feedback, conservative backoff and a sticky safety lock after reported material information loss."
