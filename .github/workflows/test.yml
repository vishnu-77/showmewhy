name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run eval and contract tests
        run: python -m unittest discover -s evals -p 'test_*.py'

  plugin-acceptance:
    name: Claude plugin acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_PLUGIN_PREFER_HTTPS: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Claude Code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

      - name: Configure authenticated GitHub cloning
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE="https://x-access-token:${GITHUB_TOKEN}@github.com/"
          git config --global --add url."${AUTH_BASE}".insteadOf "https://github.com/"
          git config --global --add url."${AUTH_BASE}".insteadOf "git@github.com:"
          git config --global --add url."${AUTH_BASE}".insteadOf "ssh://git@github.com/"

      - name: Validate ShowMeWhy plugin
        shell: bash
        run: |
          set -euo pipefail
          claude plugin validate "$GITHUB_WORKSPACE"

      - name: Add marketplace and install plugin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            claude plugin marketplace add "$GITHUB_WORKSPACE"
          else
            claude plugin marketplace add "$GITHUB_REPOSITORY"
          fi
          claude plugin install showmewhy@showmewhy

      - name: Verify atomic plugin loads with Skill and runtime
        shell: bash
        run: |
          set -euo pipefail
          claude plugin list | tee /tmp/showmewhy-plugins.txt
          grep -q 'showmewhy@showmewhy' /tmp/showmewhy-plugins.txt

          if grep -qiE 'failed to load|Status:.*✘|conflicting manifests' /tmp/showmewhy-plugins.txt; then
            echo 'ShowMeWhy was installed but failed to load.' >&2
            cat /tmp/showmewhy-plugins.txt >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          root = Path.home() / '.claude' / 'plugins'
          registry = root / 'installed_plugins.json'
          if not registry.exists():
              raise SystemExit('installed_plugins.json was not created')
          text = registry.read_text(encoding='utf-8')
          if 'showmewhy@showmewhy' not in text:
              raise SystemExit('ShowMeWhy was not persisted in the installed plugin registry')

          skills = [
              path for path in root.rglob('SKILL.md')
              if path.parent.name == 'showmewhy' and path.parent.parent.name == 'skills'
          ]
          if not skills:
              raise SystemExit('Marketplace-managed ShowMeWhy Skill was not found in the plugin cache')
          print(f'accepted: atomic plugin Skill + runtime at {skills[0]}')
          PY

  installer-posix:
    name: Installer acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Claude Code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

      - name: Seed legacy copied Skill
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/skills/showmewhy"
          printf '%s\n' 'legacy copy' > "$HOME/.claude/skills/showmewhy/SKILL.md"

      - name: Run ShowMeWhy installer twice
        shell: bash
        env:
          SHOWMEWHY_MARKETPLACE_SOURCE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash install.sh
          bash install.sh

      - name: Verify atomic install and auto-update state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HOME/.claude/skills/showmewhy"

          claude plugin list | tee /tmp/showmewhy-installer-plugins.txt
          grep -q 'showmewhy@showmewhy' /tmp/showmewhy-installer-plugins.txt
          if grep -qiE 'failed to load|Status:.*✘|conflicting manifests' /tmp/showmewhy-installer-plugins.txt; then
            cat /tmp/showmewhy-installer-plugins.txt >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          home = Path.home() / '.claude'
          state = json.loads((home / 'plugins' / 'known_marketplaces.json').read_text(encoding='utf-8'))
          if state.get('showmewhy', {}).get('autoUpdate') is not True:
              raise SystemExit('ShowMeWhy marketplace autoUpdate is not true')

          skills = [
              path for path in (home / 'plugins').rglob('SKILL.md')
              if path.parent.name == 'showmewhy' and path.parent.parent.name == 'skills'
          ]
          if not skills:
              raise SystemExit('Marketplace-managed ShowMeWhy Skill is missing')
          print(f'accepted: auto-update=true; atomic Skill at {skills[0]}')
          PY

  installer-windows:
    name: Installer acceptance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Claude Code
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod 'https://claude.ai/install.ps1'))) stable
          $localBin = Join-Path $HOME '.local\bin'
          $localBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$localBin;$env:PATH"
          claude --version

      - name: Seed legacy copied Skill
        shell: pwsh
        run: |
          $legacy = Join-Path $HOME '.claude\skills\showmewhy'
          New-Item -ItemType Directory -Path $legacy -Force | Out-Null
          Set-Content -Path (Join-Path $legacy 'SKILL.md') -Value 'legacy copy'

      - name: Run ShowMeWhy installer twice
        shell: pwsh
        env:
          SHOWMEWHY_MARKETPLACE_SOURCE: ${{ github.workspace }}
        run: |
          .\install.ps1
          .\install.ps1

      - name: Verify atomic install and auto-update state
        shell: pwsh
        run: |
          $legacy = Join-Path $HOME '.claude\skills\showmewhy'
          if (Test-Path $legacy) { throw 'Legacy copied personal Skill was not removed.' }

          $plugins = (& claude plugin list | Out-String)
          Write-Host $plugins
          if ($plugins -notmatch 'showmewhy@showmewhy') { throw 'ShowMeWhy plugin is missing.' }
          if ($plugins -match '(?i)failed to load|Status:.*✘|conflicting manifests') { throw 'ShowMeWhy plugin failed to load.' }

          $known = Join-Path $HOME '.claude\plugins\known_marketplaces.json'
          $state = Get-Content $known -Raw | ConvertFrom-Json
          if ($state.showmewhy.autoUpdate -ne $true) { throw 'ShowMeWhy marketplace autoUpdate is not true.' }

          $pluginRoot = Join-Path $HOME '.claude\plugins'
          $skills = Get-ChildItem -Path $pluginRoot -Filter SKILL.md -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'showmewhy' -and $_.Directory.Parent.Name -eq 'skills' }
          if (-not $skills) { throw 'Marketplace-managed ShowMeWhy Skill is missing.' }

          Write-Host "accepted: auto-update=true; atomic Skill at $($skills[0].FullName)"
