<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">ShowMeWhy typewriter demo</title>
  <desc id="desc">An agent claim types in, ShowMeWhy runs, and only one unresolved verification gap remains.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill:#F7F7F4; }
    .ink { fill:#0A0A0A; }
    .muted { fill:#666; }
    .rule { stroke:#D8D8D2; stroke-width:1.5; }
    .mono { font: 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font: 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing:.7px; }
    .l1,.l2,.l3,.l4,.scan,.result,.gap { clip-path: inset(0 100% 0 0); }
    .l1 { animation:type1 8s steps(37,end) infinite; }
    .l2 { animation:type2 8s steps(28,end) infinite; }
    .l3 { animation:type3 8s steps(11,end) infinite; }
    .scan { animation:scan 8s steps(18,end) infinite; }
    .result { animation:result 8s steps(20,end) infinite; }
    .gap { animation:gap 8s steps(29,end) infinite; }
    .cursor1,.cursor2,.cursor3 {
      opacity:0;
      animation:blink 0.75s step-end infinite;
    }
    .cursor1 { animation-name:cursor1,blink; animation-duration:8s,.75s; animation-timing-function:linear,step-end; animation-iteration-count:infinite,infinite; }
    .cursor2 { animation-name:cursor2,blink; animation-duration:8s,.75s; animation-timing-function:linear,step-end; animation-iteration-count:infinite,infinite; }
    .cursor3 { animation-name:cursor3,blink; animation-duration:8s,.75s; animation-timing-function:linear,step-end; animation-iteration-count:infinite,infinite; }

    @keyframes type1 {
      0%,5% { clip-path:inset(0 100% 0 0) }
      27%,88% { clip-path:inset(0 0 0 0) }
      100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes type2 {
      0%,28% { clip-path:inset(0 100% 0 0) }
      42%,88% { clip-path:inset(0 0 0 0) }
      100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes type3 {
      0%,44% { clip-path:inset(0 100% 0 0) }
      54%,88% { clip-path:inset(0 0 0 0) }
      100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes scan {
      0%,56% { clip-path:inset(0 100% 0 0) }
      64%,69% { clip-path:inset(0 0 0 0) }
      72%,100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes result {
      0%,70% { clip-path:inset(0 100% 0 0) }
      78%,94% { clip-path:inset(0 0 0 0) }
      100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes gap {
      0%,77% { clip-path:inset(0 100% 0 0) }
      87%,94% { clip-path:inset(0 0 0 0) }
      100% { clip-path:inset(0 100% 0 0) }
    }
    @keyframes cursor1 {
      0%,4%,28%,100% { opacity:0 }
      5%,27% { opacity:1 }
    }
    @keyframes cursor2 {
      0%,27%,43%,100% { opacity:0 }
      28%,42% { opacity:1 }
    }
    @keyframes cursor3 {
      0%,43%,55%,100% { opacity:0 }
      44%,54% { opacity:1 }
    }
    @keyframes blink {
      0%,49% { visibility:visible }
      50%,100% { visibility:hidden }
    }

    @media (prefers-color-scheme: dark) {
      .bg { fill:#0D1218; }
      .ink { fill:#F7F7F4; }
      .muted { fill:#A4A7AA; }
      .rule { stroke:#30363D; }
    }
    @media (prefers-reduced-motion: reduce) {
      .l1,.l2,.l3,.scan,.result,.gap { animation:none; clip-path:inset(0 0 0 0); }
      .cursor1,.cursor2,.cursor3 { display:none; }
      .scan { display:none; }
    }
  </style>

  <rect class="bg" width="960" height="300"/>
  <line class="rule" x1="28" y1="28" x2="932" y2="28"/>
  <text class="muted label" x="32" y="56">AGENT</text>

  <g class="l1">
    <text class="ink mono" x="32" y="91">Done. All status states render correctly.</text>
  </g>
  <rect class="ink cursor1" x="490" y="69" width="2" height="28"/>

  <g class="l2">
    <text class="muted small" x="32" y="126">Decorative dots removed. Header clean.</text>
  </g>
  <rect class="ink cursor2" x="454" y="108" width="2" height="23"/>

  <line class="rule" x1="28" y1="149" x2="932" y2="149"/>

  <g class="l3">
    <text class="ink mono" x="32" y="184">&gt; /showmewhy</text>
  </g>
  <rect class="ink cursor3" x="188" y="162" width="2" height="28"/>

  <g class="scan">
    <text class="muted small" x="32" y="219">checking evidence…</text>
  </g>

  <g class="result">
    <text class="ink label" x="32" y="222">5 VERIFIED · 1 NEEDS YOU</text>
  </g>
  <g class="gap">
    <text class="ink mono" x="32" y="258">DONE state was never rendered.</text>
  </g>
</svg>