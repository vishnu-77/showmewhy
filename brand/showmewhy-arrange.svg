<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">ShowMeWhy verification transcript demo</title>
  <desc id="desc">A short agent transcript invokes ShowMeWhy, briefly checks evidence, then leaves one unresolved claim and one next action.</desc>

  <style>
    :root { color-scheme: light dark; }

    .bg { fill:#F7F7F4; }
    .frame { fill:none; stroke:#D8D8D2; stroke-width:1.25; }
    .rule { stroke:#D8D8D2; stroke-width:1; }
    .ink { fill:#0A0A0A; }
    .muted { fill:#666; }
    .accent { fill:#9A641F; }

    .sans {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .label { font-size:13px; font-weight:700; letter-spacing:.85px; }
    .body { font-size:18px; }
    .small { font-size:15px; }
    .cmd { font-size:18px; }
    .strong { font-size:16px; font-weight:700; letter-spacing:.25px; }

    .command {
      opacity:0;
      animation:command 12s ease-in-out infinite;
    }
    .checking {
      opacity:0;
      animation:checking 12s ease-in-out infinite;
    }
    .result {
      opacity:0;
      animation:result 12s ease-in-out infinite;
    }
    .result-detail {
      opacity:0;
      animation:resultDetail 12s ease-in-out infinite;
    }
    .result-next {
      opacity:0;
      animation:resultNext 12s ease-in-out infinite;
    }
    .scene {
      animation:scene 12s ease-in-out infinite;
    }
    .pulse {
      opacity:.35;
      animation:pulse 1.05s ease-in-out infinite;
    }
    .p2 { animation-delay:.16s; }
    .p3 { animation-delay:.32s; }

    @keyframes command {
      0%,10% { opacity:0; }
      16%,92% { opacity:1; }
      97%,100% { opacity:0; }
    }
    @keyframes checking {
      0%,20% { opacity:0; }
      25%,34% { opacity:1; }
      39%,100% { opacity:0; }
    }
    @keyframes result {
      0%,35% { opacity:0; }
      42%,92% { opacity:1; }
      97%,100% { opacity:0; }
    }
    @keyframes resultDetail {
      0%,40% { opacity:0; }
      47%,92% { opacity:1; }
      97%,100% { opacity:0; }
    }
    @keyframes resultNext {
      0%,45% { opacity:0; }
      52%,92% { opacity:1; }
      97%,100% { opacity:0; }
    }
    @keyframes scene {
      0%,94% { opacity:1; }
      100% { opacity:0; }
    }
    @keyframes pulse {
      0%,100% { opacity:.25; }
      50% { opacity:1; }
    }

    @media (prefers-color-scheme: dark) {
      .bg { fill:#0D1218; }
      .frame,.rule { stroke:#30363D; }
      .ink { fill:#F7F7F4; }
      .muted { fill:#A4A7AA; }
      .accent { fill:#D7A45D; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene,.command,.checking,.result,.result-detail,.result-next,.pulse {
        animation:none;
      }
      .scene,.command,.result,.result-detail,.result-next { opacity:1; }
      .checking { display:none; }
    }
  </style>

  <rect class="bg" width="960" height="300"/>
  <rect class="frame" x="24" y="18" width="912" height="264"/>

  <g class="scene">
    <text class="muted sans label" x="46" y="48">AGENT</text>
    <text class="ink sans body" x="112" y="48">Done. All status states render correctly.</text>
    <text class="muted sans small" x="112" y="73">Decorative dots removed · header and footer unchanged</text>

    <line class="rule" x1="46" y1="92" x2="914" y2="92"/>

    <g class="command">
      <text class="muted sans label" x="46" y="121">YOU</text>
      <text class="ink mono cmd" x="112" y="121">/showmewhy</text>
    </g>

    <g class="checking">
      <text class="muted mono small" x="112" y="160">checking evidence</text>
      <circle class="muted pulse" cx="259" cy="155" r="2.1"/>
      <circle class="muted pulse p2" cx="269" cy="155" r="2.1"/>
      <circle class="muted pulse p3" cx="279" cy="155" r="2.1"/>
    </g>

    <g class="result">
      <text class="muted sans label" x="46" y="160">SHOWMEWHY</text>
      <text class="ink sans strong" x="154" y="160">5 verified</text>
      <text class="accent sans strong" x="244" y="160">· 1 needs you</text>
    </g>

    <g class="result-detail">
      <text class="muted sans label" x="46" y="202">NEEDS YOU</text>
      <text class="ink sans body" x="154" y="202">DONE renders green in the actual UI.</text>
      <text class="muted sans small" x="154" y="226">No rendered witness exists.</text>
    </g>

    <g class="result-next">
      <text class="muted sans label" x="46" y="260">DO NEXT</text>
      <text class="ink sans small" x="154" y="260">Trigger DONE and inspect the indicator.</text>
    </g>
  </g>
</svg>